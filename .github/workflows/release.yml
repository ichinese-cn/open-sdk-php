# Packagist 从公开仓库的 tag 读取版本，首次提交包后配置 GitHub webhook；不存发布令牌。
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['5.6', '7.0', '7.4', '8.2', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl, json, hash, ctype
          tools: composer:2.2
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - name: 检查 tag 和生成版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: php -r 'require "vendor/autoload.php"; if ("v" . IChinese\Open\Gen\Meta::VERSION !== getenv("GITHUB_REF_NAME")) exit(1);'
      - run: composer test
      - run: composer archive --format=zip --dir=dist
